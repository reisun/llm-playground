services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - llm-network
    restart: unless-stopped

  agent-gateway:
    build: ./agent-gateway
    container_name: agent-gateway
    volumes:
      - ~/.claude:/mnt/claude:ro
      - ~/.claude.json:/home/appuser/.claude.json:ro
      - ~/.config/gh:/mnt/gh:ro
      - /home/reisun/workspace:/workspace
      - shared-data:/shared-data
    networks:
      - llm-network
    restart: unless-stopped

  internal-proxy:
    image: nginx:alpine
    container_name: llm-internal-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - llm-network
    depends_on:
      - ollama
      - agent-gateway
    restart: unless-stopped

volumes:
  ollama-data:
  shared-data:
    name: shared-data

networks:
  llm-network:
    external: true
