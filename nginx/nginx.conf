worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # Docker internal DNS – resolve at runtime so nginx starts even if upstream is down
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Ollama API
        location /llm/ {
            set $ollama_upstream ollama:11434;
            rewrite ^/llm/(.*) /$1 break;
            proxy_pass http://$ollama_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # Agent Gateway API
        location /agent/ {
            set $agent_upstream agent-gateway:8000;
            proxy_pass http://$agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1800s;
        }

        # Agent Gateway health
        location /health {
            set $agent_upstream agent-gateway:8000;
            proxy_pass http://$agent_upstream/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
